name: Publish to npm

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm Trusted Publisher（OIDC）免 token 发布所需
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # node 24 自带 npm ≥ 11.5：Trusted Publisher 要求的最低 npm 版本
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # 防呆：tag 必须与 package.json 版本一致（推荐用 npm version patch/minor/major 自动同步两者）
      - name: Check tag matches package.json version
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="v$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::Tag ${TAG} 与 package.json 版本 ${VERSION} 不一致（请先 npm version 再推送 tag）"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # 认证走 npm Trusted Publisher（OIDC）：仓库/工作流已在 npmjs.com 登记，
      # 无需 NPM_TOKEN；登记的 workflow 文件名须为 publish.yml
      - name: Publish to npm
        run: npm publish --access public
